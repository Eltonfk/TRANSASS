name: CI

on:
  push:
    branches: [main, candidate/*]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-test.lock

      - name: Run offline unit test suite
        env:
          # The web app creates its state dir at import time; point it at a
          # writable temp path on CI instead of the container default /app.
          TRANSLATOR_WEB_STATE_DIR: /tmp/transass-state
          ANIME_SUBTITLE_LIBRARY_ROOT: /tmp/transass-state/anime-subtitle-library
          TRANSLATOR_GLOSSARY_PATH: /tmp/transass-state/glossary_v1.json
        run: |
          # CI runs the environment-independent unit suite.  The remaining
          # tests/offline files are operational tests that require the
          # author's canonical state / runtime evidence (see docs/TESTING.md).
          PYTHONPATH=src/subtranslate python3 -m pytest -v \
            tests/offline/test_v238_canonical_port.py \
            tests/offline/test_transport_providers.py \
            tests/offline/test_subtranslate_readonly_probe.py \
            tests/offline/test_subtranslate_context_inspect.py \
            tests/offline/test_subtranslate_next_routing.py \
            tests/offline/test_subtranslate_command_dispatch.py \
            tests/offline/test_subtranslate_guard_source_closure.py \
            tests/offline/test_subtranslate_guard_source_closure_repair.py \
            tests/offline/test_subtranslate_guard_mediation_source_closure.py

      - name: Compile check
        run: |
          python3 -m compileall -q src/subtranslate

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --pull=false -f deploy/Dockerfile -t transass:ci .