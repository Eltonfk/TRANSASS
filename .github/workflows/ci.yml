name: CI

on:
  push:
    branches: [main, candidate/*]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          # Guard installer tests read git objects from historical commits;
          # a shallow clone would raise GIT_OBJECT_NOT_AVAILABLE.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -r requirements-test.lock

      - name: Run offline unit test suite
        env:
          # The web app creates its state dir at import time; point it at a
          # writable temp path on CI instead of the container default /app.
          TRANSLATOR_WEB_STATE_DIR: ${{ runner.temp }}/transass-state
        run: |
          python3 scripts/check_release.py
          python3 scripts/run_test_shard.py --shard ${{ matrix.shard }} --total 4 \
            --junit-dir "${{ runner.temp }}/test-results"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-tests-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Compile check
        if: matrix.shard == 1
        run: |
          python3 -m compileall -q src/subtranslate

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          build_version="$(PYTHONPATH=src/subtranslate python3 -c 'from _version import __version__; print(__version__)')"
          docker build --pull=false \
            --build-arg TRANSASS_BUILD_VERSION="${build_version}" \
            --build-arg TRANSASS_BUILD_COMMIT="${GITHUB_SHA}" \
            -f deploy/Dockerfile -t transass:ci .
