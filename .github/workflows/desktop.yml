name: Desktop bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: transass-linux-x86_64
          - os: windows-latest
            artifact: transass-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate release identity
        run: python scripts/check_release.py --ref "${{ github.ref_name }}"
      - name: Install Desktop build dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-test.lock
          python -m pip install -r desktop/packaging/requirements-desktop.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Test Desktop runtime
        env:
          TRANSASS_TEST_WINDOWS_INSTALLER: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: |
          python -m pytest desktop/tests -q
          python desktop/tests/run_beta_smoke.py
      - name: Stage pinned media tools on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          media_bin="$RUNNER_TEMP/transass-media-bin"
          python deploy/install_static_ffmpeg.py --dest "$media_bin"
          echo "TRANSASS_MEDIA_BIN_DIR=$media_bin" >> "$GITHUB_ENV"
      - name: Stage media tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=9.0.1 -y --no-progress
          $mediaBin = Join-Path $env:RUNNER_TEMP "transass-media-bin"
          New-Item -ItemType Directory -Force -Path $mediaBin | Out-Null
          $toolsRoot = Join-Path $env:ChocolateyInstall "lib\ffmpeg\tools"
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $source = Get-ChildItem -LiteralPath $toolsRoot -Filter $name -Recurse -File |
              Select-Object -First 1
            if ($null -eq $source) {
              throw "$name não foi encontrado após instalar o pacote FFmpeg"
            }
            Copy-Item -LiteralPath $source.FullName -Destination (Join-Path $mediaBin $name)
          }
          "TRANSASS_MEDIA_BIN_DIR=$mediaBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python desktop/packaging/make_icon.py build/transass.ico
      - name: Build onedir bundle
        run: python desktop/packaging/build_bundle.py --dist build/desktop
      - name: Smoke test frozen bundle
        run: python desktop/tests/run_bundle_smoke.py build/desktop/Transass/Transass
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            desktop/packaging/linux/build_appimage.sh
      - name: Smoke test AppImage entry point
        if: runner.os == 'Linux'
        shell: bash
        run: |
          expected="Transass $(PYTHONPATH=src/subtranslate python -c 'from _version import __version__; print(__version__)')"
          actual="$(APPIMAGE_EXTRACT_AND_RUN=1 build/Transass-x86_64.AppImage --version)"
          test "$actual" = "$expected"
          extracted="$(mktemp -d "$RUNNER_TEMP/transass-appimage-smoke-XXXXXX")"
          cd "$extracted"
          "$GITHUB_WORKSPACE/build/Transass-x86_64.AppImage" --appimage-extract > extract.log
          python "$GITHUB_WORKSPACE/desktop/tests/run_bundle_smoke.py" squashfs-root/usr/bin/Transass
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc desktop/packaging/windows/installer.iss
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath Output -Filter "Transass-Setup-*.exe")
          if ($installers.Count -ne 1) { throw "Instalador da release não é único" }
          ./desktop/tests/run_installer_smoke.ps1 -Installer $installers[0].FullName
      - name: Finalize release files
        shell: bash
        run: |
          mkdir -p build/release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp Output/Transass-Setup-*.exe build/release/
          fi
          python desktop/packaging/generate_sbom.py build/release
          mv build/release/sbom.cdx.json "build/release/sbom-${{ matrix.artifact }}.cdx.json"
          python desktop/packaging/checksums.py build/release
          mv build/release/SHA256SUMS "build/release/SHA256SUMS-${{ matrix.artifact }}.txt"
      - name: Upload installers and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/release
          if-no-files-found: error
          retention-days: 14
