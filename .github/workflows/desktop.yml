name: Desktop bundles

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: transass-linux-x86_64
          - os: windows-latest
            artifact: transass-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Desktop build dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-test.lock
          python -m pip install -r desktop/packaging/requirements-desktop.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Test Desktop runtime
        run: |
          python -m pytest desktop/tests -q
          python desktop/tests/run_beta_smoke.py
      - name: Stage pinned media tools on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          media_bin="$RUNNER_TEMP/transass-media-bin"
          python deploy/install_static_ffmpeg.py --dest "$media_bin"
          echo "TRANSASS_MEDIA_BIN_DIR=$media_bin" >> "$GITHUB_ENV"
      - name: Stage media tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mediaBin = Join-Path $env:RUNNER_TEMP "transass-media-bin"
          New-Item -ItemType Directory -Force -Path $mediaBin | Out-Null
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $source = (Get-Command $name -CommandType Application -ErrorAction Stop).Source
            Copy-Item -LiteralPath $source -Destination (Join-Path $mediaBin $name)
          }
          "TRANSASS_MEDIA_BIN_DIR=$mediaBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate Windows icon
        if: runner.os == 'Windows'
        run: python desktop/packaging/make_icon.py build/transass.ico
      - name: Build onedir bundle
        run: python desktop/packaging/build_bundle.py --dist build/desktop
      - name: Smoke test frozen bundle
        run: python desktop/tests/run_bundle_smoke.py build/desktop/Transass/Transass
      - name: Generate checksums and SBOM
        run: |
          python desktop/packaging/checksums.py build/desktop
          python desktop/packaging/generate_sbom.py build/desktop
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            desktop/packaging/linux/build_appimage.sh
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc desktop/packaging/windows/installer.iss
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath Output -Filter "Transass-Setup-*.exe" |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "Instalador do Transass não foi gerado"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "TransassInstalled"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Instalação silenciosa falhou com código $($install.ExitCode)"
          }
          python desktop/tests/run_bundle_smoke.py (Join-Path $installDir "Transass.exe")
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Desinstalador não foi criado"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Desinstalação silenciosa falhou com código $($uninstall.ExitCode)"
          }
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/desktop
            build/desktop/**/*.exe
            build/Transass-x86_64.AppImage
            build/release
            Output/*.exe
