services:
  transass:
    image: ${SUBTRANSLATE_IMAGE:-subtranslate:v2.5.1}
    container_name: transass
    restart: unless-stopped
    init: true
    user: "1000:1000"
    extra_hosts:
      # Linux does not provide this Docker Desktop alias automatically; it
      # lets the container reach a host-published Ollama port consistently.
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    env_file:
      # compose.yaml fica em deploy/; o .env operacional fica na raiz do
      # projeto. Mantê-lo explícito evita perder chaves e demais overrides.
      - path: ../.env
        required: false
    environment:
      # MEDIA_ROOT/STATE_DIR no .env são caminhos do host; dentro do
      # container o serviço deve usar exclusivamente os pontos montados.
      MEDIA_ROOT: /shows
      STATE_DIR: /app/state
      TRANSLATOR_PIPELINE: ${TRANSLATOR_PIPELINE:-v2_3_8}
      TRANSLATOR_SOURCE_LANGUAGE: ${TRANSLATOR_SOURCE_LANGUAGE:-inglês}
      TRANSLATOR_OLLAMA_URL: ${TRANSLATOR_OLLAMA_URL:-http://host.docker.internal:11434}
      TRANSLATOR_OLLAMA_MODEL: ${TRANSLATOR_OLLAMA_MODEL:-qwen3.5:9b}
      TRANSLATOR_FALLBACK_OLLAMA_MODEL: ${TRANSLATOR_FALLBACK_OLLAMA_MODEL:-qwen3.5:9b}
      TRANSLATOR_REVIEW_MODEL: ${TRANSLATOR_REVIEW_MODEL:-qwen3.5:9b}
      TRANSLATOR_REVIEW_MAX_PER_FILE: ${TRANSLATOR_REVIEW_MAX_PER_FILE:-30}
      TRANSLATOR_BATCH_SIZE: ${TRANSLATOR_BATCH_SIZE:-4}
      TRANSLATOR_CONTEXT_NEIGHBORS: ${TRANSLATOR_CONTEXT_NEIGHBORS:-1}
      TRANSLATOR_CONTEXT_MAX_CHARS: ${TRANSLATOR_CONTEXT_MAX_CHARS:-360}
      TRANSLATOR_MIN_FILE_AGE_SECONDS: ${TRANSLATOR_MIN_FILE_AGE_SECONDS:-600}
      TRANSASS_GPU_THERMAL_INTERVAL_S: ${TRANSASS_GPU_THERMAL_INTERVAL_S:-1}
      TRANSASS_GPU_THERMAL_COOLING_WINDOW_S: ${TRANSASS_GPU_THERMAL_COOLING_WINDOW_S:-30}
      TRANSASS_GPU_THERMAL_TRIP_OVERRIDE_S: ${TRANSASS_GPU_THERMAL_TRIP_OVERRIDE_S:-60}
      TRANSASS_GPU_THERMAL_RESUME_C: ${TRANSASS_GPU_THERMAL_RESUME_C:-}
      TRANSLATOR_BASE_LIBRARY: /shows
      ANIME_LIBRARY_ROOTS: /shows
      TRANSLATOR_WEB_STATE_DIR: /app/state
      ANIME_SUBTITLE_LIBRARY_ROOT: /app/state/anime-subtitle-library
      TRANSLATOR_GLOSSARY_PATH: /app/state/glossary_v1.json
      V238_QWEN_PHYSICAL_MAXIMUM: ${V238_QWEN_PHYSICAL_MAXIMUM:-256}
    volumes:
      # Aponte MEDIA_ROOT para a pasta com seus vídeos/séries e STATE_DIR para
      # onde o app deve guardar o estado (Library, filas, config de motor).
      - "${MEDIA_ROOT:?MEDIA_ROOT deve ser definido no .env (use --env-file .env)}:/shows:rw"
      - "${STATE_DIR:?STATE_DIR deve ser definido no .env (use --env-file .env)}:/app/state:rw"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    ports:
      # BIND_ADDR=0.0.0.0 expõe na rede local; use 127.0.0.1 para só local.
      - "${BIND_ADDR:-0.0.0.0}:${WEB_PORT:-5050}:5000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
