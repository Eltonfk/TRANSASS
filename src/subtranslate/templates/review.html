<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"><link rel="apple-touch-icon" href="/favicon.svg?v=2">
<title>Revisão humana · Transass</title>
<link rel="stylesheet" href="/static/review.css"></head><body><main>
<header><div><a class="back" href="/">← Voltar para a central</a><h1>Revisão humana</h1><div class="muted">Você cuida do português; o robô fica proibido de corrigir a própria prova.</div></div><div id="meta" class="muted">Carregando…</div></header>
<section class="panel review-control"><ol class="review-steps" aria-label="Etapas da revisão"><li id="stepReview" class="active"><span>1</span>Revisar eventos</li><li id="stepCreate"><span>2</span>Criar versão</li><li id="stepApprove"><span>3</span>Aprovar</li><li id="stepPublish"><span>4</span>Publicar</li></ol><div class="toolbar filters"><label for="filter">Situação<select id="filter"><option value="">Todas</option><option value="UNREVIEWED">Não revisadas</option><option value="NEEDS_CORRECTION">Precisam de correção</option><option value="CORRECTED">Corrigidas</option><option value="APPROVED">Aprovadas</option><option value="REJECTED">Rejeitadas</option></select></label><label for="search">Buscar<input id="search" type="search" placeholder="Texto ou número do evento"></label><div class="event-navigation"><button id="prev">← Evento anterior</button><button id="next">Próximo evento →</button></div></div><div class="review-summary"><div id="counts" class="muted"></div><div id="version"></div></div><div class="review-next-action"><span id="nextActionHint" class="muted">Revise os eventos antes de criar uma nova versão.</span><button class="button primary" id="materialize" hidden>Criar versão corrigida</button><button class="button approve" id="approveVersion" hidden>Aprovar versão corrigida</button><button class="button primary" id="publishVersion" hidden>Publicar versão aprovada</button></div><div id="reviewNotice" role="status" aria-live="polite"></div></section>
<section id="segments" class="panel"><div class="muted">Abrindo sessão…</div></section>
</main><script src="/static/review.js"></script></body></html>
